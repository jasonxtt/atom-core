# ==============================================================================
# atom 用户规则表（atom 设计文档第 3.1、4 节）
# ==============================================================================
# 规则本身不写在这里：存在 webinfo/atom_rules.json，由管理 API /api/v1/atom/rules 增删改查、拖动排序；
# 自定义规则集（远程 URL / 本地列表）存在 webinfo/atom_rulesets.json 和 webinfo/atom_rulesets/<id>-<revision>.txt，
# 由 /api/v1/atom/rulesets 管理。没有 atom_rules.json 时使用默认规则表：局域网和私有域名 → 直连，广告 → 屏蔽，
# 代理修正（cusnocn）→ 代理到 Final，直连修正（cuscn）→ 直连。
#
# 主流程（config_custom.yaml）在系统固定项（重写、类型屏蔽）之后执行 $atom_rules：
# 第一条命中的规则给查询打上动作标记，主流程按标记分派：
#   marks.block  40   屏蔽：空应答
#   marks.proxy  41   代理 → 组：A/AAAA 向 sing-box 要 FakeIP，发往 nocnfake 的查询带 EDNS0 65001 SET 组；其他类型问国外 DNS
#   marks.direct 42   直连：国内 DNS
#   marks.route  43   直连，但规则指定了上游组（dns）或关了缓存（cache: false）：交给程序生成的 $atom_direct。
#                     上游组是 aliapi 插件（nocnfake 除外）加上 webinfo/settings.json 的自定义组（atom_groups，
#                     由 POST/PUT/DELETE /api/v1/atom/upstreams 管理）；每组两个数字 mark，带缓存的先过 cache_atom
#                     （sub_config/cache.yaml）。DDNS 就写成"直连 + 上游组 + 不缓存"的规则，放在最前面。
# 没命中的查询继续走原国内外判断（国外结果发 CLEAR，由 sing-box 的 route.final 处理）。
#
# builtin：规则的 ruleset 条件可以直接引用的内置集合。
#   adguard 是 adguard_rule（sub_config/adguard.yaml），按它自己的屏蔽/放行规则匹配；
#   geosite_cn、geosite_no_cn、cuscn、cusnocn 是 unified_matcher1 打标的名单，按 mapper 给它们打的 fast_mark 判断
#   （所以 $atom_rules 必须在 $unified_matcher1 之后）。它们都可以用 POST /api/v1/atom/rulesets/{id}/refresh 重新下载。
#
# singbox：本机 sing-box 怎么运行（atom 设计文档第 5、6 节）。节点、节点组、Final 和 sing-box 设置存在
# webinfo/atom_proxy.json，由 /api/v1/atom/nodes、groups、final、settings 管理；atom 完整生成 sing-box
# 的配置（dir 下的 config.json，用户不手改），改动时：sing-box check → 原子写入 → reload 命令 → 用 Clash API
# 确认（每次换新密钥）→ 失败就写回旧配置再重载。
#   binary          sing-box 程序（check 用）；dir 是它的工作目录（config.json、cache.db），相对路径在配置根目录下
#   reload          写入配置后执行的命令：独立的 systemd 单元，ExecReload 发 SIGHUP；单元没在运行时 reload-or-restart 会启动它
#   clash_api       Clash API 只监听本机
#   dns_in          FakeIP DNS 入站，必须和 forward_1.yaml 里 nocnfake 的地址一致
#   atomdns         本机 AtomDNS 的 DNS 地址，mixed 入站（settings 里的 mixed_port，默认 7890）先用它 resolve
#   redirect_port / tproxy_port   nft 把 FakeIP 网段和 IP 规则网段的 TCP / UDP 导进来的端口
#   resolver_group  解析节点域名的默认上游：取这个上游组里第一个 udp/tcp 地址（settings 的 resolver 可以另外指定）
#   nft_table       nft 表 inet <名字>（由安装器装好，见 atom docs/deploy-nft.md）。应用成功后和启动时，
#                   atom 用 `nft -f` 一次性替换其中的集合 fakeip4（FakeIP 网段）和 iprule4（IPv4 IP 规则网段）；
#                   失败只记日志和 status.nft.sync。不写就不碰 nft。nft 是命令（默认 [nft]）
plugins:
  - tag: atom_rules
    type: atom_rules
    args:
      marks: {proxy: 41, direct: 42, block: 40, route: 43}   #route：直连规则指定了上游组或关了缓存，交给生成的 $atom_direct
      mapper: unified_matcher1
      builtin: [adguard, geosite_cn, geosite_no_cn, cuscn, cusnocn]
      proxy: $main_proxy                        #下载远程规则集用的代理；定义: sub_config/settings.yaml
      singbox:
        binary: /usr/local/bin/sing-box
        dir: sing-box
        reload: [systemctl, reload-or-restart, atom-sing-box.service]
        clash_api: "127.0.0.1:9090"
        dns_in: "127.0.0.1:6666"
        atomdns: "127.0.0.1:53"
        redirect_port: 7892
        tproxy_port: 7893
        resolver_group: domestic
        nft_table: atom
