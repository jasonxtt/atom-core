plugins:
#列表外域名解析IP为此列表中IP，归入直连
  - tag: direct_ip
    type: ip_set
    args:
      files:
        - "rule/direct_ip.txt"

#重定向
  - tag: rewrite
    type: rewrite
    args:
      files:
        - "rule/rewrite.txt"
      dns: $sequence_local_in                    #在进程内用国内上游解析重写目标，不占用端口；定义: sub_config/forward_1.yaml

#代理修正：geosite-cn 里的国外域名（atom 规则表的内置规则集 cusnocn，默认规则表把它代理到 Final）
  - tag: cusnocn
    type: sd_set_light    
    args:
      proxy: $main_proxy                         #定义: sub_config/settings.yaml
      local_config: "srs/cusnocn.json" 

#直连修正：geolocation-!cn 里的国内域名（atom 规则表的内置规则集 cuscn，默认规则表把它直连）
  - tag: cuscn
    type: sd_set_light    
    args:
      proxy: $main_proxy                         #定义: sub_config/settings.yaml
      local_config: "srs/cuscn.json" 

#中国域名列表
  - tag: geosite_cn
    type: sd_set_light    
    args:
      proxy: $main_proxy                         #定义: sub_config/settings.yaml
      local_config: "srs/geositecn.json" 

#中国IP列表
  - tag: geoip_cn
    type: si_set    
    args:
      proxy: $main_proxy                         #定义: sub_config/settings.yaml
      local_config: "srs/geoipcn.json" 

#国外域名列表
  - tag: geosite_no_cn
    type: sd_set_light    
    args:
      proxy: $main_proxy                         #定义: sub_config/settings.yaml
      local_config: "srs/geositenocn.json" 

#ddns域名列表
  - tag: ddnslist
    type: domain_set_light
    args:
      files:
        - "rule/ddnslist.txt"

#统一域名匹配,设置fast_mark和域名输出tag
#atom：黑名单（mark 1）、灰名单（7）、白名单（8）在第 6 步删除，用户在规则表里写屏蔽、代理、直连规则；
#cuscn（13）、cusnocn（15）由规则表按 mark 判断（atom_rules.yaml 的 builtin），原判断里不再有它们的分支
#学习结果（记忆直连/记忆代理/记忆无V4/记忆无V6/特殊域名）不在这里：由 route_learner（sub_config/route_learner.yaml）在求值时并入，
#学习层的标签在前、mark 位或、命中后不设默认 mark 17
  - tag: unified_matcher1
    type: domain_mapper
    args:
      default_mark: 17 
      default_tag: "未命中"
      rules:
        - tag: adguard
          mark: 5 
          output_tag: "广告屏蔽"
        - tag: ddnslist
          mark: 6 
          output_tag: "DDNS域名"
        - tag: cuscn
          mark: 13
          output_tag: "直连域名"
        - tag: geosite_no_cn
          mark: 14
          output_tag: "非中国域名"
        - tag: cusnocn
          mark: 15
          output_tag: "代理域名"
        - tag: geosite_cn
          mark: 16
          output_tag: "中国域名"
     
