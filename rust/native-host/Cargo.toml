[package]
name = "atomdns-native-host"
version = "0.6.6"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "atomdns"
path = "src/main.rs"

[[bin]]
name = "atomdns-settings-migrate"
path = "src/bin/settings_migrate.rs"

[dependencies]
# atom fork: share links (vmess, ss) are base64.
base64 = "=0.22.1"
flate2 = "=1.1.9"
hickory-proto = { version = "0.25.2", default-features = false }
# Rule-source downloads (M1-a2): the same reviewed pins `atomdns-upstream-core`
# already resolves (HTTP/1.1 client connection only, no pooled client).
http-body-util = { version = "=0.1.3", default-features = false }
hyper = { version = "=1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
atomdns-cache-core = { path = "../cache-core" }
atomdns-dns-core = { path = "../dns-core" }
atomdns-matcher-core = { path = "../matcher-core" }
atomdns-sequence-core = { path = "../sequence-core" }
atomdns-upstream-core = { path = "../upstream-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
socket2 = "0.6"
ring = "=0.17.14"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt", "signal"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
url = "2"
# Pure-Rust zstd decoding for mihomo `.mrs` rule sets (decoder only).
ruzstd = { version = "=0.9.1", default-features = false, features = ["std"] }
yaml_serde = "=0.10.7"

[dev-dependencies]
base64 = "=0.22.1"
bytes = "1"
h2 = "=0.4.19"
h3 = { version = "=0.0.8", default-features = false }
h3-quinn = { version = "=0.0.10", default-features = false }
http = "1"
quinn = { version = "=0.11.7", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "=0.14.7", default-features = false, features = ["ring"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "net", "param", "process", "thread"] }
